<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アルバム</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f5f5;
}

header {
  text-align: center;
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

button {
  padding: 10px 14px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  font-weight: bold;
}

#list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 6px;
  padding: 10px;
}

.thumb {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
  cursor: pointer;
}

/* viewer */
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.viewer img {
  max-width: 100%;
  max-height: 90%;
}
</style>
</head>

<body>

<header>
  <h3>アルバム</h3>

  <input type="file" id="file" multiple accept="image/*" style="display:none">

  <button onclick="document.getElementById('file').click()">
    ＋ 画像追加
  </button>

  <button onclick="clearAll()" style="background:red;">
    全削除
  </button>
</header>

<div id="list"></div>

<div id="viewer" class="viewer" onclick="closeViewer()">
  <img id="bigImg">
</div>

<script>
const file = document.getElementById("file");
const list = document.getElementById("list");
const viewer = document.getElementById("viewer");
const bigImg = document.getElementById("bigImg");

/* ✅ 読み込み */
let images = JSON.parse(localStorage.getItem("album") || "[]");

/* 保存 */
function save() {
  localStorage.setItem("album", JSON.stringify(images));
}

/* =========================
   画像追加（完全安定版）
========================= */
file.addEventListener("change", (e) => {
  const files = Array.from(e.target.files);
  let temp = [];
  let loaded = 0;

  if (files.length === 0) return;

  files.forEach(fileItem => {
    const reader = new FileReader();

    reader.onload = (event) => {
      temp.push(event.target.result);
      loaded++;

      // 全部読み終わってから一括保存
      if (loaded === files.length) {
        images = images.concat(temp);
        save();
        render();
      }
    };

    reader.readAsDataURL(fileItem);
  });

  file.value = "";
});

/* 表示 */
function render() {
  list.innerHTML = "";

  images.forEach((img, i) => {
    const el = document.createElement("img");
    el.src = img;
    el.className = "thumb";

    el.onclick = () => open(img);

    /* 長押し削除 */
    let timer;

    el.addEventListener("touchstart", () => {
      timer = setTimeout(() => remove(i), 600);
    });

    el.addEventListener("touchend", () => {
      clearTimeout(timer);
    });

    /* PC右クリック削除 */
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      remove(i);
    });

    list.appendChild(el);
  });
}

/* 拡大 */
function open(img) {
  bigImg.src = img;
  viewer.style.display = "flex";
}

function closeViewer() {
  viewer.style.display = "none";
}

/* 削除 */
function remove(i) {
  if (confirm("削除しますか？")) {
    images.splice(i, 1);
    save();
    render();
  }
}

/* 全削除 */
function clearAll() {
  if (confirm("すべて削除しますか？")) {
    images = [];
    save();
    render();
  }
}

/* 初期表示 */
render();
</script>

</body>
</html>

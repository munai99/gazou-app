<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>お気に入り画像ランチャー</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
<style>
body { margin: 0; font-family: sans-serif; background: #111; color: #fff; }
header { padding: 12px; text-align: center; background: #222; font-weight: 700; }
#inputArea { padding: 10px; }
input { width: 100%; padding: 12px; background: #333; color: #fff; border: none; box-sizing: border-box; border-radius: 8px; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
.item { position: relative; }
.item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; cursor: pointer; display: block; }
.del { position: absolute; top: 4px; right: 4px; background: red; color: white; border: none; font-size: 12px; border-radius: 3px; padding: 2px 6px; }
#viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
#error { color: orange; padding: 10px; text-align: center; }
#status { color: #9ad; padding: 6px 10px; text-align: center; font-size: 14px; }
button { touch-action: manipulation; }
</style>
</head>
<body>
<header>お気に入り画像ランチャー</header>

<div id="inputArea">
  <input type="file" id="file" accept="image/*" multiple>
</div>

<div id="status"></div>
<div id="error" style="display:none;"></div>
<div id="grid"></div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg" alt="">
</div>

<script>
const DB_NAME = 'fav-image-launcher';
const DB_VERSION = 1;
const STORE = 'images';
const MAX_SIZE = 800;
let db;

function setStatus(msg) {
  document.getElementById('status').textContent = msg || '';
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  console.error(msg);
}

function hideError() {
  const el = document.getElementById('error');
  el.style.display = 'none';
  el.textContent = '';
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('createdAt', 'createdAt', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function id() {
  return `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('FileReader error'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image load error'));
      img.onload = () => {
        try {
          const ratio = Math.min(1, MAX_SIZE / img.width, MAX_SIZE / img.height);
          const w = Math.max(1, Math.round(img.width * ratio));
          const h = Math.max(1, Math.round(img.height * ratio));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addImage(file) {
  const dataUrl = await compressImage(file);
  const tx = db.transaction(STORE, 'readwrite');
  const store = tx.objectStore(STORE);
  await new Promise((resolve, reject) => {
    const req = store.add({
      id: id(),
      name: file.name,
      dataUrl,
      createdAt: Date.now()
    });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function getAllImages() {
  const tx = db.transaction(STORE, 'readonly');
  const store = tx.objectStore(STORE);
  return await new Promise((resolve, reject) => {
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function deleteImage(imageId) {
  const tx = db.transaction(STORE, 'readwrite');
  const store = tx.objectStore(STORE);
  return await new Promise((resolve, reject) => {
    const req = store.delete(imageId);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function openViewer(img) {
  const v = document.getElementById('viewer');
  const vi = document.getElementById('viewerImg');
  vi.src = img;
  v.style.display = 'flex';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('viewerImg').src = '';
}

async function render() {
  hideError();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const items = await getAllImages();
  items.sort((a, b) => b.createdAt - a.createdAt);

  for (const item of items) {
    const div = document.createElement('div');
    div.className = 'item';

    const image = document.createElement('img');
    image.src = item.dataUrl;
    image.alt = item.name || 'image';
    image.onclick = () => openViewer(item.dataUrl);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = async (e) => {
      e.stopPropagation();
      try {
        await deleteImage(item.id);
        render();
      } catch (err) {
        showError('削除エラー: ' + (err?.message || err));
      }
    };

    div.append(image, del);
    grid.appendChild(div);
  }
}

async function init() {
  try {
    db = await openDB();
    await render();
  } catch (err) {
    showError('DB初期化エラー: ' + (err?.message || err));
  }
}

document.getElementById('file').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  setStatus(`読み込み中: 0/${files.length}`);
  for (let i = 0; i < files.length; i++) {
    try {
      await addImage(files[i]);
      setStatus(`読み込み中: ${i + 1}/${files.length}`);
    } catch (err) {
      showError('画像追加エラー: ' + files[i].name + ' / ' + (err?.message || err));
    }
  }
  e.target.value = '';
  setStatus('');
  render();
});

window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  }
  init();
});
</script>
</body>
</html>

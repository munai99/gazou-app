<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="images/icon.png?v=1">

<title>アルバム</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f5f5;
}

header {
  text-align: center;
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

button {
  padding: 10px 14px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  font-weight: bold;
}

#list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 6px;
  padding: 10px;
}

.thumb {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
  cursor: pointer;
}

/* 拡大表示 */
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.viewer img {
  max-width: 100%;
  max-height: 90%;
}
</style>
</head>

<body>

<header>
  <h3>アルバム</h3>

  <input type="file" id="file" multiple accept="image/*" style="display:none">

  <button onclick="document.getElementById('file').click()">
    ＋ 画像追加
  </button>

  <button onclick="clearAll()" style="background:red;">
    全削除
  </button>
</header>

<div id="list"></div>

<div id="viewer" class="viewer" onclick="closeViewer()">
  <img id="bigImg">
</div>

<script>
const file = document.getElementById("file");
const list = document.getElementById("list");
const viewer = document.getElementById("viewer");
const bigImg = document.getElementById("bigImg");

/* ✅ 保存データ復元 */
let images = JSON.parse(localStorage.getItem("album") || "[]");

/* 保存 */
function save() {
  localStorage.setItem("album", JSON.stringify(images));
}

/* 画像追加（複数対応・完全版） */
file.addEventListener("change", (e) => {
  const files = Array.from(e.target.files);

  files.forEach(f => {
    const reader = new FileReader();

    reader.onload = (event) => {
      images.push(event.target.result);
      save();
      render();
    };

    reader.readAsDataURL(f);
  });

  file.value = "";
});

/* 表示 */
function render() {
  list.innerHTML = "";

  images.forEach((img, i) => {
    const image = document.createElement("img");
    image.src = img;
    image.className = "thumb";

    /* 拡大 */
    image.onclick = () => open(img);

    /* 長押し削除（スマホ） */
    let timer;

    image.addEventListener("touchstart", () => {
      timer = setTimeout(() => remove(i), 600);
    });

    image.addEventListener("touchend", () => {
      clearTimeout(timer);
    });

    /* PC右クリック削除 */
    image.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      remove(i);
    });

    list.appendChild(image);
  });
}

/* 拡大表示 */
function open(img) {
  bigImg.src = img;
  viewer.style.display = "flex";
}

function closeViewer() {
  viewer.style.display = "none";
}

/* 削除 */
function remove(i) {
  if (confirm("削除しますか？")) {
    images.splice(i, 1);
    save();
    render();
  }
}

/* 全削除 */
function clearAll() {
  if (confirm("すべて削除しますか？")) {
    images = [];
    save();
    render();
  }
}

/* 初期表示 */
render();
</script>

</body>
</html>

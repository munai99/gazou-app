<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気に入り画像ランチャー</title>
<!-- 📷 完璧ファビコン（ファイル不要） -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23222'/><circle cx='50' cy='50' r='35' fill='%23fff'/><text x='50' y='60' font-size='50' text-anchor='middle' fill='%23222' font-family='sans-serif'>📷</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23222'/><circle cx='50' cy='50' r='35' fill='%23fff'/><text x='50' y='60' font-size='50' text-anchor='middle' fill='%23222' font-family='sans-serif'>📷</text></svg>">

<style>
body { margin: 0; font-family: sans-serif; background: #111; color: white; }
header { padding: 12px; text-align: center; background: #222; }
#inputArea { padding: 10px; }
input { width: 100%; padding: 10px; background: #333; color: white; border: none; box-sizing: border-box; border-radius: 6px; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
.item { position: relative; }
.item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; cursor: pointer; display: block; }
.del { position: absolute; top: 4px; right: 4px; background: #e74c3c; color: white; border: none; font-size: 14px; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
#viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
#viewer img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 12px; }
#status { color: #3498db; padding: 8px; text-align: center; font-size: 14px; }
#error { color: #e74c3c; padding: 8px; text-align: center; }
</style>
</head>
<body>

<header>📷 お気に入り画像ランチャー</header>

<div id="inputArea">
  <input type="file" id="file" accept="image/*" multiple>
  <div id="status"></div>
</div>

<div id="error" style="display:none;"></div>
<div id="grid"></div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let favs = [];
const STORAGE_KEY = 'favs_v3';
let isProcessing = false;

function showStatus(msg) {
  const status = document.getElementById('status');
  status.textContent = msg;
  setTimeout(() => status.textContent = '', 2000);
}

function showError(msg) {
  const error = document.getElementById('error');
  error.textContent = msg;
  error.style.display = 'block';
  setTimeout(() => error.style.display = 'none', 5000);
}

async function readCompressed(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const maxSize = 800;
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxSize) height *= maxSize / width;
          width = maxSize;
        } else {
          if (height > maxSize) width *= maxSize / height;
          height = maxSize;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => reject(new Error('画像読み込み失敗'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(favs.slice(0, 30)));
  } catch(e) {
    showError('容量オーバー！30枚以内にしてください');
    favs = favs.slice(0, 30);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
  }
}

function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    favs = saved ? JSON.parse(saved) : [];
  } catch(e) {
    favs = [];
  }
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  favs.forEach((img, index) => {
    const div = document.createElement('div');
    div.className = 'item';

    const image = document.createElement('img');
    image.src = img;
    image.alt = `画像 ${index + 1}`;
    image.onclick = () => openViewer(img);
    image.onerror = () => image.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23333"/><text x="50" y="55" font-size="14" text-anchor="middle" fill="%23999">画像読み込みエラー</text></svg>';

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = (e) => {
      e.stopPropagation();
      favs.splice(index, 1);
      save();
      render();
      showStatus(`${index + 1}番目を削除`);
    };

    div.append(image, del);
    grid.appendChild(div);
  });
}

function openViewer(img) {
  document.getElementById('viewerImg').src = img;
  document.getElementById('viewer').style.display = 'flex';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
}

// 初期化
load();
render();

document.getElementById('file').addEventListener('change', async (e) => {
  if (isProcessing) return;
  isProcessing = true;
  
  const files = Array.from(e.target.files);
  showStatus(`${files.length}枚読み込み中...`);
  
  for (let i = 0; i < files.length; i++) {
    try {
      const dataUrl = await readCompressed(files[i]);
      favs.push(dataUrl);
      showStatus(`${i + 1}/${files.length}完了`);
    } catch(err) {
      showError(`エラー: ${files[i].name}`);
    }
  }
  
  save();
  render();
  e.target.value = '';
  isProcessing = false;
});
</script>

</body>
</html>

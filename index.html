<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>お気に入り画像ランチャー</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
}
header {
  padding: 12px;
  text-align: center;
  background: #222;
}
#inputArea {
  padding: 10px;
}
input {
  width: 100%;
  padding: 10px;
  background: #333;
  color: white;
  border: none;
  box-sizing: border-box;
}
#grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 6px;
}
.item {
  position: relative;
}
.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  display: block;
}
.del {
  position: absolute;
  top: 4px;
  right: 4px;
  background: red;
  color: white;
  border: none;
  font-size: 12px;
  border-radius: 3px;
  padding: 2px 6px;
}
#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#viewer img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
</style>
</head>
<body>

<header>お気に入り画像ランチャー</header>

<div id="inputArea">
  <input type="file" id="file" accept="image/*" multiple>
</div>

<div id="grid"></div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg" alt="">
</div>

<script>
let favs = JSON.parse(localStorage.getItem("favs") || "[]");
render();

document.getElementById("file").addEventListener("change", async function(e) {
  const files = Array.from(e.target.files);

  for (const file of files) {
    const dataUrl = await readFileAsDataURL(file);
    favs.push(dataUrl);
  }

  save();
  render();
  e.target.value = "";
});

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function save() {
  try {
    localStorage.setItem("favs", JSON.stringify(favs));
  } catch (err) {
    alert("保存容量を超えました。画像を減らすか、サイズの小さい画像を使ってください。");
  }
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  favs.forEach((img, index) => {
    const div = document.createElement("div");
    div.className = "item";

    const image = document.createElement("img");
    image.src = img;
    image.alt = "お気に入り画像";
    image.onclick = () => openViewer(img);

    const del = document.createElement("button");
    del.className = "del";
    del.innerText = "×";
    del.onclick = (e) => {
      e.stopPropagation();
      favs.splice(index, 1);
      save();
      render();
    };

    div.appendChild(image);
    div.appendChild(del);
    grid.appendChild(div);
  });
}

function openViewer(img) {
  document.getElementById("viewerImg").src = img;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer() {
  document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>

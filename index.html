<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気に入り画像ランチャー（IndexedDB）</title>
<!-- ファビコンはicon.pngを同じフォルダに -->
<link rel="icon" type="image/png" href="icon.png">
<style>/* 前と同じCSSそのまま使用 */</style>
</head>
<body>
<!-- 前と同じHTML構造 -->
<script>
const DB_NAME = 'ImageFavs';
const STORE_NAME = 'images';

let db;

async function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
  });
}

async function loadFavs() {
  return new Promise((resolve) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result.map(item => item.dataUrl));
  });
}

async function saveFav(dataUrl) {
  const tx = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  store.add({ dataUrl });
}

let favs = [];

async function main() {
  await initDB();
  favs = await loadFavs();
  render();
  
  // ファイル選択（圧縮付き）
  document.getElementById('file').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const dataUrl = await readFileAsDataURL(file);
      await saveFav(dataUrl);
      favs.push(dataUrl);
    }
    render();
    e.target.value = '';
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = Math.min(1024, img.width);
        canvas.height = (img.height / img.width) * canvas.width;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));  // 70%品質でさらに軽く
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// render, openViewer, closeViewer, del処理は前と同じ
function render() { /* 前と同じ */ }
function openViewer(img) { /* 前と同じ */ }
function closeViewer() { /* 前と同じ */ }

main();
</script>
</body>
</html>

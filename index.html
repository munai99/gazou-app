<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像登録・表示アプリ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      background: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }
    .upload-area {
      margin: 10px 0;
      padding: 10px;
      border: 1px dashed #aaa;
      border-radius: 4px;
      background: #fff;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 5px;
      margin: 10px 0;
    }
    .thumbnail-item {
      position: relative;
      border: 1px solid #aaa;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }
    .thumbnail-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
    .delete-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 4px;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>よく見る画像アプリ</h1>

    <!-- 画像登録エリア -->
    <div class="upload-area">
      <h2>画像を登録</h2>
      <input type="file" id="file-upload" accept="image/*" multiple />
      <button id="add-btn">追加</button>
    </div>

    <!-- 画像一覧（サムネイル） -->
    <h2>登録画像一覧</h2>
    <div class="gallery" id="image-gallery"></div>

  </div>

  <!-- 元画像表示用モーダル -->
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">×</button>
    <img id="modal-img" src="" alt="拡大画像" />
  </div>

  <script>
    // 画像データを保存
    const loadImages = () => {
      const saved = localStorage.getItem('registeredImages');
      return saved ? JSON.parse(saved) : [];
    };

    const saveImages = (images) => {
      localStorage.setItem('registeredImages', JSON.stringify(images));
    };

    let images = loadImages();

    // 画像をサムネイル一覧に描画
    const renderGallery = () => {
      const gallery = document.getElementById('image-gallery');
      gallery.innerHTML = '';

      images.forEach((dataUrl, index) => {
        const item = document.createElement('div');
        item.className = 'thumbnail-item';

        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = `画像${index + 1}`;
        img.onclick = () => {
          const modal = document.getElementById('modal');
          const modalImg = document.getElementById('modal-img');
          modalImg.src = dataUrl;
          modal.style.display = 'flex';
        };

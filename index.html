<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルバムアプリ</title>

<!-- ファビコン -->
<link rel="icon" type="image/png" href="images/icon.png">

<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 12px;
  background: #f5f5f5;
}

h1 {
  font-size: 20px;
  margin-bottom: 10px;
}

#fileInput {
  margin-bottom: 10px;
}

#preview {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

/* 画像カード */
.box {
  position: relative;
  aspect-ratio: 1/1;
  border-radius: 10px;
  overflow: hidden;
  background: #ddd;
}

/* 画像 */
.box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 削除ボタン */
.delete {
  position: absolute;
  top: 5px;
  right: 5px;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 12px;
  padding: 3px 6px;
  border-radius: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>アルバム</h1>

<input type="file" id="fileInput" accept="image/*" multiple>

<div id="preview"></div>

<script>
let images = [];

/* 起動時読み込み */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("album");
  if (saved) {
    try {
      images = JSON.parse(saved);
    } catch (e) {
      images = [];
    }
  }
  render();
});

/* 画像追加（完全安定版） */
document.getElementById("fileInput").addEventListener("change", (e) => {
  const files = Array.from(e.target.files);

  const readers = files.map(file => {
    return new Promise((resolve) => {
      const reader = new FileReader();

      reader.onload = () => {
        resolve(reader.result);
      };

      reader.readAsDataURL(file);
    });
  });

  Promise.all(readers).then(results => {
    images = images.concat(results);
    save();
    render();
  });

  e.target.value = "";
});

/* 保存 */
function save() {
  localStorage.setItem("album", JSON.stringify(images));
}

/* 表示 */
function render() {
  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  images.forEach((src, index) => {
    const box = document.createElement("div");
    box.className = "box";

    const img = document.createElement("img");
    img.src = src;

    const del = document.createElement("div");
    del.className = "delete";
    del.textContent = "×";

    del.onclick = (e) => {
      e.stopPropagation();
      images.splice(index, 1);
      save();
      render();
    };

    box.appendChild(img);
    box.appendChild(del);
    preview.appendChild(box);
  });
}
</script>

</body>
</html>

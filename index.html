<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気に入り画像ランチャー</title>

<!-- アイコン -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
}

header {
  padding: 12px;
  text-align: center;
  background: #222;
}

#inputArea {
  padding: 10px;
}

input {
  width: 100%;
  padding: 10px;
  background: #333;
  color: white;
  border: none;
}

#grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 6px;
}

.item {
  position: relative;
}

.item img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
}

.del {
  position: absolute;
  top: 4px;
  right: 4px;
  background: red;
  color: white;
  border: none;
  font-size: 12px;
  border-radius: 3px;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  justify-content: center;
  align-items: center;
}

#viewer img {
  max-width: 100%;
  max-height: 100%;
}
</style>
</head>

<body>

<header>お気に入り画像ランチャー</header>

<div id="inputArea">
  <!-- ⭐ 複数選択OK -->
  <input type="file" id="file" accept="image/*" multiple>
</div>

<div id="grid"></div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let favs = JSON.parse(localStorage.getItem("favs") || "[]");

render();

// ⭐ 複数画像対応（ここが重要）
document.getElementById("file").addEventListener("change", function(e) {
  const files = Array.from(e.target.files);

  files.forEach(file => {
    const reader = new FileReader();

    reader.onload = function(ev) {
      favs.push(ev.target.result);
      save();
      render();
    };

    reader.readAsDataURL(file);
  });

  // 同じ画像を再選択できるようにリセット
  e.target.value = "";
});

// 保存
function save() {
  localStorage.setItem("favs", JSON.stringify(favs));
}

// 表示
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  favs.forEach((img, index) => {
    const div = document.createElement("div");
    div.className = "item";

    const image = document.createElement("img");
    image.src = img;

    image.onclick = () => open(img);

    const del = document.createElement("button");
    del.className = "del";
    del.innerText = "×";

    del.onclick = (e) => {
      e.stopPropagation();
      favs.splice(index, 1);
      save();
      render();
    };

    div.appendChild(image);
    div.appendChild(del);
    grid.appendChild(div);
  });
}

// 拡大表示
function open(img) {
  document.getElementById("viewerImg").src = img;
  document.getElementById("viewer").style.display = "flex";
}

// 閉じる
function closeViewer() {
  document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>

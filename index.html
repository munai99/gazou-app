<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気に入り画像ランチャー</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg=="> <!-- 埋め込みで解決 -->
<style>
body { margin: 0; font-family: sans-serif; background: #111; color: white; }
header { padding: 12px; text-align: center; background: #222; }
#inputArea { padding: 10px; }
input { width: 100%; padding: 10px; background: #333; color: white; border: none; box-sizing: border-box; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
.item { position: relative; }
.item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; cursor: pointer; display: block; }
.del { position: absolute; top: 4px; right: 4px; background: red; color: white; border: none; font-size: 12px; border-radius: 3px; padding: 2px 6px; }
#viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
#error { color: orange; padding: 10px; text-align: center; }
</style>
</head>
<body>

<header>お気に入り画像ランチャー</header>

<div id="inputArea">
  <input type="file" id="file" accept="image/*" multiple>
</div>

<div id="error" style="display:none;"></div>
<div id="grid"></div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
</div>

<script>
let favs = [];
const STORAGE_KEY = 'favs_v2';
let useLocalStorage = true;

// エラーログ表示
function showError(msg) {
  document.getElementById('error').textContent = msg;
  document.getElementById('error').style.display = 'block';
  console.error(msg);
}

// 圧縮読み込み
async function readCompressed(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const maxSize = 800;
        const ratio = Math.min(maxSize / img.width, maxSize / img.height);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(favs.slice(0, 20))); // 20枚制限で安全
  } catch(e) {
    showError('容量オーバー: 画像を20枚以内に');
  }
}

function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    favs = saved ? JSON.parse(saved) : [];
  } catch(e) {
    favs = [];
  }
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('error').style.display = 'none';

  favs.forEach((img, index) => {
    const div = document.createElement('div');
    div.className = 'item';

    const image = document.createElement('img');
    image.src = img;
    image.onclick = () => openViewer(img);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = (e) => {
      e.stopPropagation();
      favs.splice(index, 1);
      save();
      render();
    };

    div.append(image, del);
    grid.appendChild(div);
  });
}

function openViewer(img) {
  document.getElementById('viewerImg').src = img;
  document.getElementById('viewer').style.display = 'flex';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
}

// 初期化
load();
render();

document.getElementById('file').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for (const file of files) {
    try {
      const dataUrl = await readCompressed(file);
      favs.push(dataUrl);
    } catch(err) {
      showError('画像読み込みエラー: ' + file.name);
    }
  }
  save();
  render();
  e.target.value = '';
});
</script>
</body>
</html>
